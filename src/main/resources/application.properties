spring.application.name=chat
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:8b
spring.ai.ollama.chat.temperature=0.1
spring.ai.ollama.init.pull-model-strategy=when_missing

# --- Datasource (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gencosoft_chat}
spring.datasource.username=${DB_USER:gencosoft}
spring.datasource.password=${DB_PASSWORD:gencosoft}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# --- Reasoning ---
spring.ai.ollama.chat.think=false

logging.level.org.springframework.ai.chat.client.advisor=DEBUG
